# VolarIOS — iOS app, feature 004 (specs/004-ios-port/plan.md).
#
# This project compiles `../Shared` — the platform-neutral source tree, now the ONLY copy of that
# code (specs/007-apple-three-platforms/plan.md §4, 2026-08-09).
#
# SUPERSEDED WARNING, kept so nobody restores it: until 2026-08-09 this header said "Do NOT add
# `- path: ../Shared` to `Volar/project.yml`". That was correct while `Shared/` was a temporary
# *duplicate* of `Volar/Sources`, made so parallel agents could not race each other — with two
# copies of every type in the tree, compiling both really would have been a duplicate-symbol
# failure. The duplicate is gone: the 52 shared files were `git mv`d out of `Volar/Sources` into
# `Shared/`, and `Volar/project.yml` now compiles `../Shared` **and** `Sources` on purpose. Both
# app targets compiling `../Shared` is the intended end state, not a bug — each target links its
# own copy into its own binary, which is how a shared source tree works.
#
# The rule that replaces it: a type may exist in `Shared/` or in `Volar/Sources`, never in both.
# Adding a file to `Shared/` adds it to every Apple platform at once.
#
# Conventions below mirror `Volar/project.yml` on purpose (same structure, same comment style) so
# the two files stay easy to diff against each other; see inline notes for the handful of
# necessary differences (iOS platform/deployment target, bundle id, entitlements file, extra
# `../Shared` sources entry, TARGETED_DEVICE_FAMILY).
name: VolarIOS
options:
  bundleIdPrefix: tech.kioh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
packages:
  VolarCore:
    path: ../VolarCore
  # Same WhisperKit dependency as `Volar/project.yml`. WhisperKit is off by DEFAULT on iOS (plan
  # §0.1.D — SFSpeechRecognizer `.appleOnDevice` is the free-tier engine on iPhone; WhisperKit is
  # opt-in, Wi-Fi-gated model download, per plan §8 risk R3). The package dependency is still
  # required here because `Shared/Speech/WhisperKitEngine.swift` is compiled by this target
  # (it's under `../Shared`, which every source in this file's `sources:` list pulls in) even
  # though the engine is never selected by default.
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "0.9.0"
targets:
  VolarIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    # `path: Sources` is a whole-tree reference (xcodegen recursively picks up every subfolder
    # under it), same convention as `Volar/project.yml`'s `Sources` entry. `../Shared` is a
    # second whole-tree reference — the platform-neutral code shared with the macOS app (plan §5).
    # Folders under `Sources` that don't exist yet as of this task (e.g. `Intents/`, Phase 2) are
    # simply not picked up until they're created; no placeholder needed for absent directories.
    sources:
      - path: ../Shared
      - path: Sources
      - path: Resources
        excludes:
          - Info.plist
          - VolarIOS.entitlements
          # Carved out into its own `sources` entry below, same way Info.plist/entitlements are
          # excluded here and wired up through their own dedicated mechanism instead
          # (INFOPLIST_FILE / `entitlements:`) — mirrors `Volar/project.yml` exactly.
          - Assets.xcassets
      - path: Resources/Assets.xcassets
    entitlements:
      path: Resources/VolarIOS.entitlements
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        # Deliberately IDENTICAL to the macOS target's bundle ID (`Volar/project.yml`). That is not
        # a copy-paste slip — identical iOS and macOS bundle IDs are the sole precondition for
        # Universal Purchase: one App Store record, one subscription group, one purchase unlocking
        # every platform. A `.ios` suffix here would be permanent the day it first ships.
        # The watchOS target, when it exists, must use this string as its prefix
        # (`tech.kioh.Volar.watchkitapp`) — Apple requires that shape.
        PRODUCT_BUNDLE_IDENTIFIER: tech.kioh.Volar
        PRODUCT_NAME: Volar
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
        # NOTE (mirrors `Volar/project.yml`'s own note): GENERATE_INFOPLIST_FILE stays NO — the
        # `volar://` CFBundleURLTypes registration and the two usage-description strings are
        # declared directly in the physical Resources/Info.plist instead of xcodegen's
        # `target.info.properties` merge mechanism, since that mechanism only applies when
        # xcodegen itself generates the Info.plist.
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    dependencies:
      - package: VolarCore
        product: VolarCore
      - package: WhisperKit
        product: WhisperKit
  # Mirrors `Volar/project.yml`'s `VolarTests` convention: a placeholder file keeps the target
  # non-empty until Phase 2 (plan §6) adds real tests under `VolarIOS/Tests/`.
  # UNVERIFIED (feature 004, T1): written on Windows with no Xcode/xcodegen toolchain to verify
  # against — confirm on Mac that `xcodegen generate` produces a working `VolarIOSTests` bundle
  # target/scheme and that it actually builds & runs (`xcodebuild test`).
  VolarIOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      # The same 25 test files the macOS target runs, exercising the same `Shared/` sources. This
      # is the point of the move — shared code gets tested on both platforms from one copy of the
      # tests, so an iOS-only regression in shared logic cannot hide.
      # UNVERIFIED: these 25 have only ever been compiled for macOS. If they fail to build for iOS
      # on the first Mac run, the cheap triage is to drop this one line, get the app target green
      # first, then re-add it and fix the tests — the app target does not depend on it.
      - path: ../SharedTests
      - path: Tests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        # The app target's PRODUCT_NAME is `Volar` (not `VolarIOS`), so xcodegen's default
        # TEST_HOST (`VolarIOS.app/VolarIOS`) points at nothing — first CI test run, 2026-10-11.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Volar.app/Volar
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: VolarIOS
      - package: VolarCore
        product: VolarCore
schemes:
  VolarIOS:
    build:
      targets:
        VolarIOS: all
        VolarIOSTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VolarIOSTests
