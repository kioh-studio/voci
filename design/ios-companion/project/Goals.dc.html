      <button style="display: inline-flex; align-items: center; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; padding: 5px 11px; border-radius: 999px; background: transparent; border: 1px dashed rgba(255,255,255,0.18); color: #A0A4AA; cursor: pointer">+ Add reward</button>
