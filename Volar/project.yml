name: Volar
options:
  bundleIdPrefix: tech.kioh
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
# Signing lives HERE, at project level, not in Xcode's Signing & Capabilities pane: `.xcodeproj` is
# a generated artifact, so anything set through the Xcode UI is wiped by the next
# `xcodegen generate`. Without `DEVELOPMENT_TEAM` the generated project has no team at all and every
# build fails with "Volar requires a provisioning profile. Enable development signing and select a
# provisioning profile."
#
# Project level rather than inside the `Volar` target so `VolarTests` inherits it too — a macOS unit
# test bundle is code-signed as well, and giving only the app target a team makes the test target
# fail on its own with the same error.
#
# `Automatic` lets Xcode create/renew the Apple Development + Apple Distribution certs and the
# matching profiles itself. It needs the App ID `tech.kioh.Volar` to already carry the capabilities
# the entitlements file asks for (In-App Purchase) — a mismatch there surfaces
# as a profile-creation failure naming the capability, not as a signing error.
settings:
  base:
    DEVELOPMENT_TEAM: ZXWAPGR9XP
    CODE_SIGN_STYLE: Automatic
configs:
  Debug: debug
  Release: release
packages:
  VolarCore:
    path: ../VolarCore
  # NOTE: WhisperKit version may need bumping on Mac (from: 0.9.0 is a floor).
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "0.9.0"
targets:
  Volar:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    # `path: Sources` is a whole-tree reference, so xcodegen recursively picks up every
    # subfolder under it (incl. Parsing/, Reminders/, Orchestrator/ added for feature 002 —
    # each ships one _Placeholder.swift so the folder is never empty) with no per-path entries
    # needed here.
    sources:
      # The platform-neutral 52 files — models, parsing, scheduling, speech, account, and the leaf
      # views that render inside a container they do not own. `VolarIOS/project.yml` (and, later,
      # the watchOS target) compile this exact same directory. Anything added here is added to
      # every Apple platform at once, so a file only belongs here if it names no window, panel,
      # menu bar, global hotkey, or host filesystem path.
      - path: ../Shared
      # The 27 macOS-only files. Windowing, menu bar, chrome, Carbon hotkey, NSOpenPanel.
      - path: Sources
      - path: Resources
        excludes:
          - Info.plist
          - Volar.entitlements
          # Carved out into its own `sources` entry below, same way Info.plist/Volar.entitlements
          # are excluded here and wired up through their own dedicated mechanism instead
          # (INFOPLIST_FILE / `entitlements:`).
          - Assets.xcassets
      - path: Resources/Assets.xcassets
    # NOTE: there is deliberately no `entitlements:` key here. XcodeGen's `entitlements:` is a
    # GENERATOR — it writes the file at `path` from the `properties:` map underneath it. Declared
    # with a `path` but no `properties` (as it was until 2026-07-27), every `xcodegen generate`
    # overwrote the hand-written Resources/Volar.entitlements with an empty plist, silently
    # stripping all six entitlements. Losing `com.apple.security.device.audio-input` that way is
    # near-undiagnosable from the app side: App Sandbox denies the microphone BELOW the TCC layer,
    # so macOS never shows a permission prompt at all and `AVCaptureDevice.requestAccess` just
    # returns false — while System Settings still lists the app as allowed, and the Speech
    # Recognition prompt (which needs no sandbox entitlement) keeps working normally.
    #
    # Pointing CODE_SIGN_ENTITLEMENTS straight at the file instead uses it verbatim and never
    # rewrites it. If a new entitlement is ever needed, edit Resources/Volar.entitlements by hand —
    # do NOT reintroduce the `entitlements:` key.
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Resources/Volar.entitlements
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: tech.kioh.Volar
        PRODUCT_NAME: Volar
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
        # NOTE (feature 002): GENERATE_INFOPLIST_FILE stays NO — the `volar://` CFBundleURLTypes
        # registration (contracts/app-links.md) is declared directly in the physical
        # Resources/Info.plist instead of xcodegen's `target.info.properties` merge mechanism,
        # since that mechanism only applies when xcodegen itself generates the Info.plist.
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: VolarCore
        product: VolarCore
      - package: WhisperKit
        product: WhisperKit
      # Share Extension (backlog "Đường vào Volar" [I2]). Declaring it as a target dependency is
      # what makes xcodegen embed the built .appex into Volar.app/Contents/PlugIns — an extension
      # that isn't embedded never appears in any share sheet, and nothing warns you about it.
      # `embed: true` + `codeSign: true` are xcodegen's defaults for an app-extension dependency;
      # spelled out here because getting either wrong fails at install time, not build time.
      - target: VolarShareExtension
        embed: true
        codeSign: true
  # UNVERIFIED — added on Windows with no xcodegen/Xcode to verify against. Confirm on Mac that
  # `xcodegen generate` produces an embedded .appex and that "Volar" shows up in Safari's share
  # menu. Needs its own App ID (`tech.kioh.Volar.Share`) on the developer portal before Automatic
  # signing can create a profile for it — an extension is a separate signed bundle, and this is the
  # single most likely thing to fail first on the Mac.
  #
  # No app group, on purpose: the extension hands text to the app through the already-registered
  # `volar://capture` URL rather than a shared container. See ShareExtension/ShareViewController.swift.
  VolarShareExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ShareExtension
        excludes:
          - Info.plist
          - VolarShare.entitlements
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: ShareExtension/VolarShare.entitlements
        INFOPLIST_FILE: ShareExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: tech.kioh.Volar.Share
        PRODUCT_NAME: VolarShare
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  # UNVERIFIED (feature 002, T027): added on Windows without an Xcode/xcodegen toolchain to
  # verify against — confirm on Mac that `xcodegen generate` produces a working `VolarTests`
  # bundle target/scheme and that it actually builds & runs (`xcodebuild test`). No test target
  # existed in this file before this task.
  VolarTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      # 25 of the original 26 app-layer tests exercise code that now lives in `Shared/`, so they
      # live in `../SharedTests` and the iOS test target compiles the very same files. The macOS
      # target still runs all 26 — nothing was dropped from this target's coverage by the move.
      - path: ../SharedTests
      # `TourFlowTests` is the only one that stays macOS-only: it calls `TourStop.all` and
      # `TourOverlay.cardOrigin` for real, and `TourModel`/`TourAnchor` are macOS-only sources.
      - path: Tests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - target: Volar
      - package: VolarCore
        product: VolarCore
schemes:
  Volar:
    build:
      targets:
        Volar: all
        VolarTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VolarTests
